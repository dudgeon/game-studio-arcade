<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1130" width="1600" height="1130" font-family="Helvetica, Arial, sans-serif">
  <rect width="1600" height="1130" fill="#ffffff"/>

  <!-- Title -->
  <text x="60" y="62" font-size="34" font-weight="700" fill="#111">Picade wiring: which button goes on which X HAT header</text>
  <text x="60" y="96" font-size="18" fill="#444">Game Studio Arcade · matches the key map in docs/decisions.md D82 · wired this way, nothing needs remapping</text>

  <!-- ===== LEFT: control panel, seen from above ===== -->
  <text x="60" y="150" font-size="20" font-weight="700" fill="#111">1. The control panel, seen from above</text>

  <!-- panel -->
  <rect x="90" y="175" width="680" height="430" rx="18" fill="#f3f3f3" stroke="#222" stroke-width="3"/>
  <text x="430" y="205" font-size="15" fill="#666" text-anchor="middle">back of the cabinet (screen side)</text>

  <!-- joystick -->
  <circle cx="230" cy="400" r="70" fill="#dcdcdc" stroke="#222" stroke-width="2"/>
  <circle cx="230" cy="400" r="34" fill="#111"/>
  <text x="230" y="505" font-size="17" text-anchor="middle" fill="#111" font-weight="700">Joystick</text>
  <text x="230" y="528" font-size="15" text-anchor="middle" fill="#444">→ JOYSTICK</text>

  <!-- buttons: columns blue / yellow / pink; rows top / bottom -->
  <!-- top row -->
  <g>
    <circle cx="440" cy="330" r="48" fill="#2f6fde" stroke="#111" stroke-width="3"/>
    <text x="440" y="342" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">X</text>
    <rect x="410" y="384" width="60" height="28" rx="6" fill="#111"/>
    <text x="440" y="404" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 3</text>
  </g>
  <g>
    <circle cx="560" cy="330" r="48" fill="#f2c230" stroke="#111" stroke-width="3"/>
    <text x="560" y="342" font-size="38" font-weight="700" fill="#111" text-anchor="middle">Y</text>
    <rect x="530" y="384" width="60" height="28" rx="6" fill="#111"/>
    <text x="560" y="404" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 4</text>
  </g>
  <g>
    <circle cx="680" cy="330" r="48" fill="#e85a9c" stroke="#111" stroke-width="3"/>
    <text x="680" y="338" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">spare</text>
    <rect x="650" y="384" width="60" height="28" rx="6" fill="#111"/>
    <text x="680" y="404" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 5</text>
  </g>
  <!-- bottom row -->
  <g>
    <circle cx="440" cy="480" r="48" fill="#2f6fde" stroke="#111" stroke-width="3"/>
    <text x="440" y="492" font-size="38" font-weight="700" fill="#fff" text-anchor="middle">A</text>
    <rect x="410" y="534" width="60" height="28" rx="6" fill="#111"/>
    <text x="440" y="554" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 1</text>
  </g>
  <g>
    <circle cx="560" cy="480" r="48" fill="#f2c230" stroke="#111" stroke-width="3"/>
    <text x="560" y="492" font-size="38" font-weight="700" fill="#111" text-anchor="middle">B</text>
    <rect x="530" y="534" width="60" height="28" rx="6" fill="#111"/>
    <text x="560" y="554" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 2</text>
  </g>
  <g>
    <circle cx="680" cy="480" r="48" fill="#e85a9c" stroke="#111" stroke-width="3"/>
    <text x="680" y="488" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">spare</text>
    <rect x="650" y="534" width="60" height="28" rx="6" fill="#111"/>
    <text x="680" y="554" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">→ 6</text>
  </g>

  <!-- side buttons -->
  <circle cx="90" cy="300" r="22" fill="#111" stroke="#111"/>
  <text x="125" y="292" font-size="16" font-weight="700" fill="#111">Left side</text>
  <text x="125" y="312" font-size="15" fill="#111">ESC → ESC</text>
  <circle cx="770" cy="300" r="22" fill="#111" stroke="#111"/>
  <text x="735" y="250" font-size="16" font-weight="700" fill="#111" text-anchor="end">Right side</text>
  <text x="735" y="270" font-size="15" fill="#111" text-anchor="end">ENT → ENT</text>

  <!-- front strip -->
  <rect x="90" y="620" width="680" height="110" rx="10" fill="#e6e6e6" stroke="#222" stroke-width="3"/>
  <text x="430" y="752" font-size="15" fill="#666" text-anchor="middle">FRONT of the cabinet (where the player stands)</text>
  <circle cx="280" cy="675" r="26" fill="#111"/>
  <text x="320" y="670" font-size="16" font-weight="700" fill="#111">Front left</text>
  <text x="320" y="692" font-size="15" fill="#111">START → 1UP</text>
  <circle cx="560" cy="675" r="26" fill="#111"/>
  <text x="600" y="670" font-size="16" font-weight="700" fill="#111">Front right</text>
  <text x="600" y="692" font-size="15" fill="#111">COIN → COIN</text>

  <!-- what each does -->
  <text x="60" y="800" font-size="20" font-weight="700" fill="#111">What each one does</text>
  <g font-size="16" fill="#222">
    <text x="60" y="830">A B X Y: the game buttons. On Studio screens any of the six picks the lit tile.</text>
    <text x="60" y="856">START (1UP): starts a game. COIN: spends coins to make a game; on the shelf, shows the pot.</text>
    <text x="60" y="882">ESC (left side): back to the shelf. On a side so it isn't pressed by accident mid-game.</text>
    <text x="60" y="908">ENT (right side): "type it instead" on the talk screen, with a keyboard.</text>
    <text x="60" y="934">Spare pink buttons: unused for now.</text>
  </g>

  <!-- ===== RIGHT: X HAT headers ===== -->
  <text x="880" y="150" font-size="20" font-weight="700" fill="#111">2. On the Picade X HAT: find each header by its printed label</text>

  <g font-size="18" fill="#111">
    <!-- player buttons -->
    <text x="880" y="195" font-size="17" font-weight="700" fill="#444">Player buttons: headers 1 to 6</text>
    <g>
      <rect x="880" y="210" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="238" text-anchor="middle" font-weight="700">1</text>
      <circle cx="985" cy="230" r="15" fill="#2f6fde" stroke="#111" stroke-width="2"/>
      <text x="1012" y="237">A: blue, bottom row, left</text>
    </g>
    <g>
      <rect x="880" y="258" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="286" text-anchor="middle" font-weight="700">2</text>
      <circle cx="985" cy="278" r="15" fill="#f2c230" stroke="#111" stroke-width="2"/>
      <text x="1012" y="285">B: yellow, bottom row, middle</text>
    </g>
    <g>
      <rect x="880" y="306" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="334" text-anchor="middle" font-weight="700">3</text>
      <circle cx="985" cy="326" r="15" fill="#2f6fde" stroke="#111" stroke-width="2"/>
      <text x="1012" y="333">X: blue, top row, left</text>
    </g>
    <g>
      <rect x="880" y="354" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="382" text-anchor="middle" font-weight="700">4</text>
      <circle cx="985" cy="374" r="15" fill="#f2c230" stroke="#111" stroke-width="2"/>
      <text x="1012" y="381">Y: yellow, top row, middle</text>
    </g>
    <g>
      <rect x="880" y="402" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="430" text-anchor="middle" font-weight="700">5</text>
      <circle cx="985" cy="422" r="15" fill="#e85a9c" stroke="#111" stroke-width="2"/>
      <text x="1012" y="429">spare: pink, top row, right</text>
    </g>
    <g>
      <rect x="880" y="450" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="478" text-anchor="middle" font-weight="700">6</text>
      <circle cx="985" cy="470" r="15" fill="#e85a9c" stroke="#111" stroke-width="2"/>
      <text x="1012" y="477">spare: pink, bottom row, right</text>
    </g>

    <!-- utility -->
    <text x="880" y="535" font-size="17" font-weight="700" fill="#444">Black buttons: four labelled headers</text>
    <g>
      <rect x="880" y="550" width="90" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="925" y="578" text-anchor="middle" font-weight="700">1UP</text>
      <circle cx="1005" cy="570" r="15" fill="#111"/><text x="1032" y="577">front left (START)</text>
    </g>
    <g>
      <rect x="880" y="598" width="90" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="925" y="626" text-anchor="middle" font-weight="700">COIN</text>
      <circle cx="1005" cy="618" r="15" fill="#111"/><text x="1032" y="625">front right</text>
    </g>
    <g>
      <rect x="880" y="646" width="90" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="925" y="674" text-anchor="middle" font-weight="700">ESC</text>
      <circle cx="1005" cy="666" r="15" fill="#111"/><text x="1032" y="673">left side</text>
    </g>
    <g>
      <rect x="880" y="694" width="90" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="925" y="722" text-anchor="middle" font-weight="700">ENT</text>
      <circle cx="1005" cy="714" r="15" fill="#111"/><text x="1032" y="721">right side</text>
    </g>

    <!-- other -->
    <text x="880" y="780" font-size="17" font-weight="700" fill="#444">Everything else</text>
    <rect x="880" y="795" width="150" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="955" y="823" text-anchor="middle" font-weight="700">JOYSTICK</text>
    <text x="1045" y="815" font-size="16">white plug fits one way on the stick;</text>
    <text x="1045" y="835" font-size="16">wire marked 1 goes to the pin marked GND</text>
    <rect x="880" y="845" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="915" y="873" text-anchor="middle" font-weight="700">ON</text>
    <rect x="960" y="845" width="70" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="995" y="873" text-anchor="middle" font-weight="700">LED</text>
    <text x="1045" y="863" font-size="16">power button: C/NO pair → ON;</text>
    <text x="1045" y="883" font-size="16">LED 1/2 pair → LED</text>
    <rect x="880" y="895" width="150" height="40" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/><text x="955" y="923" text-anchor="middle" font-weight="700">SPEAKER</text>
    <text x="1045" y="921" font-size="16">red → +, black → −</text>
  </g>

  <!-- notes -->
  <rect x="60" y="960" width="1480" height="140" rx="10" fill="#fff8e0" stroke="#c9a227" stroke-width="2"/>
  <g font-size="16" fill="#222">
    <text x="80" y="990" font-weight="700">Notes</text>
    <text x="80" y="1016">• Each button has two wires on a small plug. Either way round works on the header: a button is just a switch.</text>
    <text x="80" y="1042">• Pimoroni's guide says the order doesn't matter "as we'll be remapping the inputs in software later on". That's true: our software already assumes this order,</text>
    <text x="80" y="1064">   so wiring it this way means no remapping. Wired differently, it still works; Claude would change the map in software at the controls check (bring-up C4).</text>
    <text x="80" y="1090">• Colour columns follow Pimoroni's "blue on the left, yellow in the middle and pink on the right". Check the layout against your panel; if it differs, tell Claude before wiring.</text>
  </g>
</svg>
