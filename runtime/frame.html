<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- D13/D21: code only from the runtime server; no fetch, sockets, images or frames. The server sends the same policy as a header. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <canvas id="screen" width="320" height="256"></canvas>
    <script type="module" src="./src/frame.js"></script>
  </body>
</html>
