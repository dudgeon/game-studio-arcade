<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House runtime</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #b4b9cf; font: 13px/1.4 ui-monospace, Menlo, monospace; }
      #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #hud { position: fixed; left: 8px; top: 6px; pointer-events: none; white-space: pre; }
      #err { position: fixed; left: 8px; right: 8px; bottom: 8px; color: #ff5a5f; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"></div>
    <div id="err"></div>
    <script type="module">
      // play.html?cart=/carts/<name>/game.js[&seed=1][&players=1][&test=1][&save=<json>][&fps=1][&glide=0][&gpu=0]
      import { createHost } from "./src/host.js";

      const q = new URLSearchParams(location.search);
      const cart = q.get("cart");
      const hud = document.getElementById("hud");
      const err = document.getElementById("err");
      if (!cart) {
        hud.textContent = "add ?cart=/carts/<name>/game.js (see /carts/ for the list)";
      } else {
        let arcade;
        try {
          arcade = createHost({
            container: document.getElementById("stage"),
            cartUrl: cart,
            seed: Number(q.get("seed") ?? 1),
            players: q.has("players") ? Number(q.get("players")) : undefined,
            save: q.has("save") ? JSON.parse(q.get("save")) : undefined,
            test: q.get("test") === "1",
            glide: q.get("glide") !== "0",
            gpu: q.get("gpu") === "any" ? "any" : q.get("gpu") !== "0",
            onError: (e) => (err.textContent += `${e.message}\n`),
            onStar: () => console.log("[arcade] star"),
          });
        } catch (e) {
          err.textContent = e.message; // e.g. a bad ?players=
        }
        if (arcade) {
          window.arcade = arcade;
          arcade.ready.catch((e) => (err.textContent = e.message));
          if (q.get("fps") === "1") {
            setInterval(() => (hud.textContent = `${arcade.fps} fps  x${arcade.scale}  ${arcade.players}P  ticks ${arcade.ticks}`), 250);
          }
        }
      }
    </script>
  </body>
</html>
