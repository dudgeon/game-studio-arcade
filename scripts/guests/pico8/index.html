<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>@TITLE@</title>
<style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
/* PICO-8's screen is 128 by 128: 6 times that is 768, the cabinet's whole height (D81). */
#canvas { position: absolute; left: 50%; top: 50%; width: 768px; height: 768px; transform: translate(-50%, -50%); image-rendering: pixelated; outline: none; }
</style>
</head>
<body>
<canvas id="canvas" width="128" height="128" tabindex="0"></canvas>
<script src="cabinet-keys.js"></script>
<script>
// What PICO-8's exported player (game.js) looks for on its page (D386). NOT RUN YET: written
// from PICO-8's export template before Geoff's PICO-8 was on the mini; check it against one
// real export (scripts/guests/build.mjs says how) before any PICO-8 guest ships.
var pico8_state = [];
var pico8_buttons = [0, 0, 0, 0, 0, 0, 0, 0];
var pico8_gamepads = { count: 0 };
var pico8_gpio = new Array(128);
var pico8_audio_context = new (window.AudioContext || window.webkitAudioContext)();
var Module = { canvas: document.getElementById("canvas"), arguments: [] };
</script>
<script src="game.js"></script>
</body>
</html>
